name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner and image name
        id: image
        run: |
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          IMAGE_NAME=$(echo "${REPO_NAME,,}" | sed 's/_/-/g')
          echo "owner_name=${OWNER_NAME}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner_name }}/${{ steps.image.outputs.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.owner_name }}/${{ steps.image.outputs.image_name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.image.outputs.owner_name }}/${{ steps.image.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.image.outputs.owner_name }}/${{ steps.image.outputs.image_name }}:buildcache,mode=max
